# ===================================================================
# ====== PERFIL DE DESENVOLVIMENTO (dev) PARA O BANCO SQLITE ======
# ===================================================================

# Define o driver JDBC para se conectar com o SQLite.
spring.datasource.driver-class-name=org.sqlite.JDBC

# A URL de conexão para o SQLite, apontando para um arquivo local.
spring.datasource.url=jdbc:sqlite:lib-musical.db

# SQLite não requer usuário ou senha para arquivos locais, podem ficar em branco.
spring.datasource.username=
spring.datasource.password=

# --- Configuração do Hibernate ---

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# 'update': Na inicialização, o Hibernate compara seus Models (@Entity) com as
# tabelas existentes e tenta criar/alterar o que for necessário.
spring.jpa.hibernate.ddl-auto=update

# Opcional: Faz o Hibernate imprimir no console todos os comandos SQL executados.
spring.jpa.show-sql=true